matrix:
  homeserver: https://matrix.example.org
  user_id: "@openrig-bot:matrix.example.org"
  device_id: OPENRIG_BRIDGE
  allowed_users:
    - "@owner:matrix.example.org"
  state_dir: /var/lib/openrig-matrix-bridge

openrig:
  command: /opt/node24/bin/rig
  codex_home: /root/.codex
  sender_session: matrix-bridge@kernel
  human_destinations:
    - owner@external
  queue_inbound_messages: true
  inbound_message_priority: urgent
  inbound_queue_source: owner@external
  steering_mode: auto
  steering_max_chars: 2000
  steering_batch_window_seconds: 0.5
  steering_admission_timeout_seconds: 2.0
  # Related top-level messages: a voice note, image, file or gallery and the
  # owner's messages around it join one context while each gap stays within
  # burst_inactivity_seconds (0 disables) and the whole exchange within
  # burst_max_span_seconds. Thread and reply relations ignore the inactivity gap
  # but stay within burst_max_span_seconds;
  # two plain texts never join each other.
  burst_inactivity_seconds: 45
  burst_max_span_seconds: 300
  # Optional, off by default. true adds one 👍 to each human message once it is
  # durably accepted (queued or steered); it means accepted, not finished.
  acceptance_reaction_enabled: false
  reaction_feedback_enabled: true
  mirror_commentary: true
  # Safe default true: activity-card commentary and queue previews hide paths,
  # cookies, credentials, connection URIs, fenced output and long secrets.
  # false posts them unredacted to the room (one warning at startup); set it
  # only on an instance whose owner wants that and accepts the risk.
  commentary_redaction_enabled: true
  poll_interval_seconds: 0.2
  # `rig ps --nodes` can take seconds on a large fleet. One node inventory is
  # shared for this long; a stale one up to inventory_max_age_seconds is used
  # at once while it is refreshed in the background. 0 and 0 read every time.
  inventory_cache_seconds: 2.0
  inventory_max_age_seconds: 10.0
  human_queue_poll_seconds: 2.0
  max_message_age_minutes: 60
  # Also bounds how long a steering batch may wait for transcript admission
  # while the seat stays busy before it fails closed (never resent).
  response_timeout_minutes: 360
  status_refresh_seconds: 30

transcription:
  enabled: true
  download_root: /var/cache/openrig-matrix-bridge/parakeet
  max_audio_bytes: 26214400
  num_threads: 4

media:
  enabled: true
  inbox_dir: /var/lib/openrig-matrix-bridge/media-inbox
  max_image_bytes: 26214400
  max_file_bytes: 26214400
  # true posts "… empfangen, lade und entschlüssele …" and "… gespeichert …"
  # for each image, file and gallery. false keeps those quiet; the media is
  # still stored and sent to the agent, and failures are still reported.
  transfer_notices_enabled: true

avatars:
  enabled: true
  replace_existing: false
  set_profile: true

agents:
  advisor:
    display_name: Advisor
    session: advisor-lead@kernel
  operator:
    display_name: Operator
    session: operator-agent@kernel
  queue:
    display_name: Queue
    session: queue-worker@kernel
  curator:
    display_name: Curator
    session: curator-agent@collection-curation
  assistant:
    display_name: Assistant
    session: assistant-agent@personal-assistant
  knowledge:
    display_name: Knowledge
    session: knowledge-steward@knowledge-management
  ebay:
    display_name: eBay
    session: ebay-agent@web-ops

