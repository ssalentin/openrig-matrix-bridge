matrix:
  homeserver: https://matrix.example.org
  user_id: "@openrig-bot:matrix.example.org"
  device_id: OPENRIG_BRIDGE
  allowed_users:
    - "@owner:matrix.example.org"
  state_dir: /var/lib/openrig-matrix-bridge

openrig:
  command: /opt/node24/bin/rig
  codex_home: /root/.codex
  sender_session: matrix-bridge@kernel
  human_destinations:
    - owner@external
  queue_inbound_messages: true
  inbound_message_priority: urgent
  inbound_queue_source: owner@external
  reaction_feedback_enabled: true
  mirror_commentary: true
  poll_interval_seconds: 0.2
  human_queue_poll_seconds: 2.0
  max_message_age_minutes: 60
  response_timeout_minutes: 360
  status_refresh_seconds: 30

transcription:
  enabled: true
  download_root: /var/cache/openrig-matrix-bridge/parakeet
  max_audio_bytes: 26214400
  num_threads: 4

media:
  enabled: true
  inbox_dir: /var/lib/openrig-matrix-bridge/media-inbox
  max_image_bytes: 26214400
  max_file_bytes: 26214400

avatars:
  enabled: true
  replace_existing: false
  set_profile: true

agents:
  advisor:
    display_name: Advisor
    session: advisor-lead@kernel
  operator:
    display_name: Operator
    session: operator-agent@kernel
  queue:
    display_name: Queue
    session: queue-worker@kernel
  curator:
    display_name: Curator
    session: curator-agent@collection-curation
  assistant:
    display_name: Assistant
    session: assistant-agent@personal-assistant
  knowledge:
    display_name: Knowledge
    session: knowledge-steward@knowledge-management
  ebay:
    display_name: eBay
    session: ebay-agent@web-ops

