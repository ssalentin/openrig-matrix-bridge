[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openrig-matrix-bridge"
version = "0.3.0"
description = "Matrix rooms for specific OpenRig agent seats"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "matrix-nio[e2e]>=0.25,<0.26",
  "PyYAML>=6.0,<7",
  "sherpa-onnx>=1.13,<2",
  "numpy>=1.24,<3",
]

[project.scripts]
openrig-matrix-bridge = "openrig_matrix_bridge.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

