[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openrig-matrix-bridge"
version = "0.12.0"
description = "Matrix rooms for specific OpenRig agent seats"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "matrix-nio[e2e]>=0.25,<0.26",
  "mistune>=3.0,<4",
  "PyYAML>=6.0,<7",
  "sherpa-onnx>=1.13,<2",
  "numpy>=1.24,<3",
]

[project.scripts]
openrig-matrix-bridge = "openrig_matrix_bridge.cli:main"

[project.urls]
Homepage = "https://github.com/ssalentin/openrig-matrix-bridge"
Repository = "https://github.com/ssalentin/openrig-matrix-bridge"
Issues = "https://github.com/ssalentin/openrig-matrix-bridge/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openrig_matrix_bridge = [
  "assets/avatars/*.png",
  "assets/avatars/manifest.json",
  "assets/branding/source/*.svg",
  "assets/branding/export/*.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

